version: 2
updates:
  # Renovate owns regular version PRs; Dependabot owns alert-driven security PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    labels: [dependencies, security]

  - package-ecosystem: docker
    directories:
      - /
      - /resources/mediawiki
      - /resources/memcachephp
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    labels: [dependencies, security]

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    labels: [dependencies, security]
