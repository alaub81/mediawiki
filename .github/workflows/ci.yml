name: CI (lint, build, scan, e2e)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: tests/requirements-lint.txt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .lint-tools
          key: native-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lint-tools.json') }}
      - name: Plan applicable checks and image dependencies
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/change_plan.py
      - name: Run shared repository linters
        run: ./tests/linter-check.sh
      - name: Run shared offline and Compose tests
        if: steps.plan.outputs.tests == 'true'
        run: ./tests/test-check.sh

  stack:
    name: Stack (${{ matrix.arch }})
    needs: lint
    if: needs.lint.outputs.runtime == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TEST_ARCH: ${{ matrix.arch }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      # Only the third-party Wikimedia OpenSearch image needs amd64 emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
        if: matrix.arch == 'arm64'
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - name: Resolve isolated test build inputs
        run: ./tests/run-python.sh tests/stack.py --build-file "$RUNNER_TEMP/build.yml"
      - name: Build both current-source application images once
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7
        with:
          source: .
          files: ${{ runner.temp }}/build.yml
          targets: mediawiki,memcachephp
          load: true
          pull: true
          set: |
            *.platform=linux/${{ matrix.arch }}
            mediawiki.cache-from=type=gha,scope=mediawiki-${{ matrix.arch }}
            mediawiki.cache-to=type=gha,mode=max,scope=mediawiki-${{ matrix.arch }}
            memcachephp.cache-from=type=gha,scope=memcachephp-${{ matrix.arch }}
            memcachephp.cache-to=type=gha,mode=max,scope=memcachephp-${{ matrix.arch }}
      - name: Record immutable application image identities
        run: |
          ./tests/run-python.sh tests/ci_images.py record --arch "$TEST_ARCH" \
            --receipt "$RUNNER_TEMP/tested-images.json"
      - name: Run full MediaWiki E2E and MemcachePHP security tests without rebuilding
        run: ./tests/e2e-check.sh --skip-build --reports "$RUNNER_TEMP/e2e"
      - name: Cache pinned native check tools
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .lint-tools
          key: native-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lint-tools.json') }}
      - name: Install pinned Trivy
        if: always() && steps.build.outcome == 'success'
        run: ./tests/run-python.sh tests/install_lint_tools.py trivy
      - name: Determine vulnerability database cache date
        if: always() && steps.build.outcome == 'success'
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache the vulnerability database
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-
      - name: Scan the same image IDs even if E2E failed
        if: always() && steps.build.outcome == 'success'
        env:
          PATH_PREFIX: ${{ github.workspace }}/.lint-tools/bin
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          ./tests/run-python.sh tests/ci_images.py scan --arch "$TEST_ARCH" \
            --receipt "$RUNNER_TEMP/tested-images.json" --reports "$RUNNER_TEMP/trivy"
      - name: Keep complete scan reports and E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ci-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/trivy/
            ${{ runner.temp }}/e2e/
            ${{ runner.temp }}/tested-images.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Detect complete SARIF reports
        id: sarif
        if: always()
        shell: bash
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/trivy
        run: |
          shopt -s nullglob
          reports=("$SARIF_DIRECTORY"/*.sarif)
          if (( ${#reports[@]} > 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload complete SARIF on main
        if: >-
          always() && github.event_name == 'push' && github.event.repository.private == false &&
          steps.sarif.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with:
          sarif_file: ${{ runner.temp }}/trivy

  ci_result:
    name: CI required
    if: always()
    needs: [lint, stack]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STACK_RESULT: ${{ needs.stack.result }}
          RUNTIME: ${{ needs.lint.outputs.runtime }}
        run: |
          echo "lint=$LINT_RESULT stack=$STACK_RESULT runtime=$RUNTIME"
          [[ "$LINT_RESULT" == success ]]
          if [[ "$RUNTIME" == true ]]; then
            [[ "$STACK_RESULT" == success ]]
          else
            [[ "$RUNTIME" == false && "$STACK_RESULT" == skipped ]]
          fi
