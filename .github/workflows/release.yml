name: Release (build & push)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      rebuild_tags:
        description: 'Enable refresh of existing tags (exact-commit CI required)'
        required: false
        default: false
        type: boolean
      num_tags:
        description: 'Number of recent stable tags to refresh (1-20)'
        required: false
        default: 2
        type: number
  schedule:
    - cron: '0 1 * * 2'  # Refresh packages weekly on Tuesday.

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_dispatch' || inputs.rebuild_tags
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      releases: ${{ steps.plan.outputs.releases }}
      has_images: ${{ steps.plan.outputs.has_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require exact-commit CI and plan immutable image reuse
        id: plan
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REBUILD_COUNT: ${{ inputs.num_tags || 2 }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_plan.py

  platform:
    name: Validate ${{ matrix.release.ref }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RELEASE: ${{ toJSON(matrix.release) }}
      TEST_ARCH: ${{ matrix.arch }}
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      DOCKER_BUILD_RECORD_RETENTION_DAYS: 7
    steps:
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .automation
          persist-credentials: false
      - name: Checkout the exact selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ matrix.release.sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4
        if: matrix.arch == 'arm64'
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare current/historical contexts or pull previous immutable images
        id: prepare
        run: python3 .automation/tools/release_platform.py prepare
      - name: Build changed or unavailable images once
        if: steps.prepare.outputs.has_builds == 'true'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e  # v7
        with:
          source: .
          files: reports/build.json
          load: true
          pull: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: .automation/.lint-tools
          key: release-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.automation/lint-tools.json') }}
      - name: Install pinned Trivy
        run: python3 .automation/tests/install_lint_tools.py trivy
      - name: Run complete E2E and scan both exact images, including reused images
        env:
          PATH_PREFIX: ${{ github.workspace }}/.automation/.lint-tools/bin
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          python3 .automation/tools/release_platform.py validate
      - name: Stage only the validated platform digests
        run: python3 .automation/tools/release_platform.py stage
      - name: Keep complete scan reports and E2E diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-reports-${{ matrix.release.ref }}-${{ matrix.arch }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Keep successful platform publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-platform-${{ matrix.release.ref }}-${{ matrix.arch }}
          path: reports/platform-published.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Upload complete SARIF even when the gate fails
        if: always() && github.event.repository.private == false && hashFiles('reports/trivy/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4
        with:
          sarif_file: reports/trivy

  publish:
    name: Publish ${{ matrix.ref }}
    needs: [plan, platform]
    if: needs.platform.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      RELEASE: ${{ toJSON(matrix) }}
      RELEASE_TAG: ${{ matrix.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download only this run's matching platform receipts
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "release-platform-${RELEASE_TAG}-*" --dir "$RUNNER_TEMP/platforms"
      - name: Verify complete indexes and promote version aliases without rebuilding
        run: |
          python3 tools/release_publish.py --receipts "$RUNNER_TEMP/platforms" \
            --output "$RUNNER_TEMP/published.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: release-published-${{ matrix.ref }}
          path: ${{ runner.temp }}/published.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  notes:
    needs: [plan, publish]
    if: github.event_name == 'push' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download successful publication receipt
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-published-${RELEASE_TAG}" --dir "$RUNNER_TEMP/publication"
      - name: Create English notes and preserve existing releases
        run: |
          python3 tools/create_release_notes.py --tag "$RELEASE_TAG" \
            --publication "$RUNNER_TEMP/publication/published.json" \
            --output "$RUNNER_TEMP/release-notes.md" --publish
