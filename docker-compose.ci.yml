services:
  mediawiki:
    build:
      context: ./resources/mediawiki
      dockerfile: Dockerfile
      args:
        MW_INSTALL_EXTENSIONS: ${MW_INSTALL_EXTENSIONS:-}
        MW_INSTALL_SKINS: ${MW_INSTALL_SKINS:-}
    image: mmediawiki-custom
    pull_policy: never
    env_file:
      - ${MW_CI_ENV_FILE:-.env.ci}

  memcachephp:
    build:
      context: ./resources/memcachephp
      dockerfile: Dockerfile
    image: memcachephp
    pull_policy: never
