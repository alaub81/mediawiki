# Local-build overlay: load after compose.yml and compose.config.yml.
services:
  mediawiki:
    build:
      context: ./resources/mediawiki
      dockerfile: Dockerfile
      args:
        MW_INSTALL_EXTENSIONS: ${MW_INSTALL_EXTENSIONS:-}
        MW_INSTALL_SKINS: ${MW_INSTALL_SKINS:-}
        MW_CONFIG_FILE: ${MW_CONFIG_FILE:-}
    image: mediawiki-custom:local

  memcachephp:
    build:
      context: ./resources/memcachephp
      dockerfile: Dockerfile
    image: memcachephp:local
