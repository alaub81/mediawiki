services:
  mediawiki:
    image: ghcr.io/alaub81/mediawiki-custom:${MW_VERSION:-latest}
    depends_on:
      database:
        condition: service_healthy
      memcached:
        condition: service_started
      opensearch:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
        required: false
      clamav:
        condition: service_healthy
        required: false
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-R00tPassword}
      MW_SERVER_URL: ${MW_SERVER_URL:-http://localhost:8080}
      MW_SITENAME: ${MW_SITENAME:-My Own Wiki}
      MW_METANAMESPACE: ${MW_METANAMESPACE:-My_Own_Wiki}
      MW_AUTO_UPDATE: ${MW_AUTO_UPDATE:-false}
      MW_JOBS_CRON: ${MW_JOBS_CRON:-false}
      MW_PHP_UPLOAD_MAX_FILESIZE: ${MW_PHP_UPLOAD_MAX_FILESIZE:-100M}
      MW_PHP_POST_MAX_SIZE: ${MW_PHP_POST_MAX_SIZE:-100M}
      MW_SITEMAP_GENERATION: ${MW_SITEMAP_GENERATION:-false}
      MW_SITEMAP_CRON: "${MW_SITEMAP_CRON:-20 */12 * * *}"
      MW_SITEMAP_IDENTIFIER: "${MW_SITEMAP_IDENTIFIER:-wiki}"
      MW_SITEMAP_SERVER: "${MW_SITEMAP_SERVER:-}"
      MW_SITEMAP_URLPATH: "${MW_SITEMAP_URLPATH:-}"
      MW_SITEMAP_SKIP_REDIRECTS: "${MW_SITEMAP_SKIP_REDIRECTS:-}"
      MW_SITEMAP_RUN_ON_START: "${MW_SITEMAP_RUN_ON_START:-false}"
      MW_ROTTENLINKS_GENERATION: ${MW_ROTTENLINKS_GENERATION:-false}
      MW_ROTTENLINKS_CRON: "${MW_ROTTENLINKS_CRON:-30 */12 * * *}"
      MW_ROTTENLINKS_RUN_ON_START: "${MW_ROTTENLINKS_RUN_ON_START:-false}"
      MW_CS_INDEX_UPDATE: ${MW_CS_INDEX_UPDATE:-false}
      MW_CS_INDEX_CRON: "${MW_CS_INDEX_CRON:-15 * * * *}"
      MW_CS_INDEX_RUN_ON_START: "${MW_CS_INDEX_RUN_ON_START:-false}"
      MW_OPENSEARCH_URL: "${MW_OPENSEARCH_URL:-http://opensearch:9200}"
      WANDA_ENABLED: "${WANDA_ENABLED:-false}"
      MW_ELASTICSEARCH_URL: "${MW_ELASTICSEARCH_URL:-http://elasticsearch:9200}"
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      TZ: ${TZ:-UTC}
    # env_file:
    #   - .env.mwsetup
    ports:
      - ${MW_HTTP_PORT:-8080}:80
    labels:
      com.centurylinklabs.watchtower.enable: true
    volumes:
      - data_mw_images:/var/www/html/images
      # After initial setup, download LocalSettings.php to data/conf directory
      # and uncomment the following line and use compose to restart
      # the mediawiki service
      # - ./data/mediawiki/conf/LocalSettings.php:/var/www/html/LocalSettings.php:ro
      # or custom config file don't forget to set MW_CONFIG_FILE env var in .env
      # - ./data/mediawiki/conf/mw_local_settings:/var/www/html/conf/:rw
      # --- Custom files and volumes: ---
      # - ./data/mediawiki/conf/robots.txt:/var/www/html/robots.txt:ro
      # - ./data/mediawiki/conf/.htaccess:/var/www/html/.htaccess:ro
      # - ./data/mediawiki/favicon/:/var/www/html/favicon:ro
      # - ./data/mediawiki/conf/ads.txt:/var/www/html/ads.txt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          set -e
          base="http://localhost"

          # 1) API erreichbar?
          curl -fsS "$$base/api.php?action=query&meta=siteinfo&format=json" | grep -q '"query"'

          # 2) /sitemap.xml gibt 301?
          status="$$(curl -fsSI "$$base/sitemap.xml" | awk 'NR==1{print $$2}')"
          [ "$$status" = "301" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      app-nw:
      backend-nw:
        aliases:
          - wiki

  database:
    image: mariadb:${MARIADB_VERSION:-12.3}
    volumes:
      - data_db:/var/lib/mysql
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-R00tPassword}
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - TZ=${TZ:-UTC}
    labels:
      com.centurylinklabs.watchtower.enable: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb -u root -p$${MARIADB_ROOT_PASSWORD} -e 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      backend-nw:
        aliases:
          - db

  clamav:
    image: clamav/clamav-debian:${CLAMAV_VERSION:-stable}
    restart: unless-stopped
    profiles: ["clamav"]
    volumes:
      - clamav_db:/var/lib/clamav
      # if you want to use custom clamd.conf, uncomment the following line
      # - ./data/clamav/conf/clamd.conf:/etc/clamav/clamd.conf:ro
    environment:
      - TZ=${TZ:-UTC}
    labels:
      com.centurylinklabs.watchtower.enable: true
    healthcheck:
      # Checks: clamd answers PONG to PING
      test: ["CMD-SHELL", "echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      backend-nw:
      # need app-nw for fetching updates
      app-nw:

  memcached:
    image: memcached:${MEMCACHED_VERSION:-alpine}
    restart: unless-stopped
    command: ["-m", "${MEMCACHED_CACHE_MB:-16}"]
    environment:
      - TZ=${TZ:-UTC}
    labels:
      com.centurylinklabs.watchtower.enable: true
    healthcheck:
      test:
        - CMD-SHELL
        - |
          printf 'version\r\n' \
            | nc -w 2 127.0.0.1 11211 2>/dev/null \
            | tr -d '\r' \
            | grep -qiE '^VERSION[[:space:]]+[0-9]'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      backend-nw:
        aliases:
          - wikimemcached

  memcachephp:
    image: ghcr.io/alaub81/memcachephp:${MEMCACHEPHP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - memcached
    environment:
      TZ: ${TZ:-UTC}
      MEMCACHEPHP_SERVERS: ${MEMCACHEPHP_SERVERS:-memcached:11211}
      MEMCACHEPHP_ADMIN_USER: ${MEMCACHEPHP_ADMIN_USER:-admin}
      MEMCACHEPHP_ADMIN_PASS: ${MEMCACHEPHP_ADMIN_PASS:-supersecret}
      MEMCACHEPHP_DATE_FORMAT: ${MEMCACHEPHP_DATE_FORMAT:-Y-m-d H:i:s}
      MEMCACHEPHP_GRAPH_SIZE: ${MEMCACHEPHP_GRAPH_SIZE:-200}
      MEMCACHEPHP_MAX_ITEM_DUMP: ${MEMCACHEPHP_MAX_ITEM_DUMP:-50}
    labels:
      com.centurylinklabs.watchtower.enable: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$${MEMCACHEPHP_ADMIN_PASS_FILE:-}" ]; then
            pass="$$(cat "$${MEMCACHEPHP_ADMIN_PASS_FILE}")" || exit 1;
          else
            pass="$${MEMCACHEPHP_ADMIN_PASS:-supersecret}";
          fi;
          curl -fsS -u "$${MEMCACHEPHP_ADMIN_USER:-admin}:$${pass}" http://localhost/ |
          grep -Eiq 'memcache|server stats|slabs'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      backend-nw:

  opensearch:
    platform: ${OPENSEARCH_PLATFORM:-linux/amd64}
    image: docker-registry.wikimedia.org/repos/search-platform/cirrussearch-opensearch-image:${OPENSEARCH_VERSION:-v1.3.20-12}
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP_MIN:-512m} -Xmx${OPENSEARCH_HEAP_MAX:-512m}     # Keep Xms and Xmx equal
    volumes:
      - data_osdata:/usr/share/opensearch/data
    labels:
      com.centurylinklabs.watchtower.enable: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      backend-nw:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.19.21}
    restart: unless-stopped
    profiles: ["elasticsearch"]
    environment:
      - TZ=${TZ:-UTC}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.autoconfiguration.enabled=false
      - ES_JAVA_OPTS=-Xms${ELASTICSEARCH_HEAP_MIN:-512m} -Xmx${ELASTICSEARCH_HEAP_MAX:-512m}
    volumes:
      - data_esdata:/usr/share/elasticsearch/data
    labels:
      com.centurylinklabs.watchtower.enable: true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      backend-nw:

volumes:
  data_db:
  data_mw_images:
  clamav_db:
  data_osdata:
  data_esdata:

networks:
  app-nw:
    internal: false
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: app-${PROJECT_NAME:-mw}
  backend-nw:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: be-${PROJECT_NAME:-mw}
