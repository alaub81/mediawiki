# Add to docker-compose.yml to read credentials from ./secrets/ instead of
# passing password values as container environment variables.
services:
  mediawiki:
    # The setup script and LocalSettings.php read these files directly.
    env_file: !reset []
    environment:
      MW_DB_PASS: !reset null
      MW_WANDA_OPENAI_API_KEY: !reset null
      MW_DB_NAME: ${MARIADB_DATABASE:-wikidb}
      MW_DB_USER: ${MARIADB_USER:-wikiuser}
    secrets:
      - mw_db_pass
      - mariadb_root_password
      - mw_admin_pass
      - mw_wanda_openai_api_key

  database:
    environment: !override
      MARIADB_DATABASE: ${MARIADB_DATABASE:-wikidb}
      MARIADB_USER: ${MARIADB_USER:-wikiuser}
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/mw_db_pass
      TZ: ${TZ:-UTC}
    secrets:
      - mariadb_root_password
      - mw_db_pass
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb -u root -p"$$(cat /run/secrets/mariadb_root_password)" -e 'SELECT 1'

  memcachephp:
    environment:
      MEMCACHEPHP_ADMIN_PASS: !reset null
      MEMCACHEPHP_ADMIN_PASS_FILE: /run/secrets/memcachephp_admin_pass
    secrets:
      - memcachephp_admin_pass

secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password
  mw_db_pass:
    file: ./secrets/mw_db_pass
  mw_admin_pass:
    file: ./secrets/mw_admin_pass
  memcachephp_admin_pass:
    file: ./secrets/memcachephp_admin_pass
  mw_wanda_openai_api_key:
    file: ./secrets/mw_wanda_openai_api_key
