# allows %2F etc. for REST/VisualEditor
AllowEncodedSlashes NoDecode

<Directory "/var/www/html">
    AllowOverride All
    Options FollowSymLinks
    Require all granted

    <IfModule mod_rewrite.c>
        RewriteEngine On

        # /index.php/Foo  →  /wiki/Foo  (permanent)
        RewriteRule ^index\.php/(.*)$ /wiki/$1 [QSA,R=301,L]

        # Do NOT overwrite existing files/folders
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # /wiki/...  →  /index.php  (Short URLs)
        RewriteRule ^/?wiki(/.*)?$ /index.php [QSA,L]
    </IfModule>
</Directory>

# Uploads are static files; never trust configuration stored in the upload volume.
<Directory "/var/www/html/images">
    AllowOverride None
    Options -Indexes -ExecCGI -Includes
    SetHandler None
    RemoveHandler .php .php3 .php4 .php5 .php7 .php8 .phtml .pht .phar .cgi .pl .py .sh
    RemoveType .php .php3 .php4 .php5 .php7 .php8 .phtml .pht .phar

    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>

    # Deny scripts even when followed by another extension, such as .php.jpg.
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|pht|phar|cgi|pl|py|sh|shtml)(?:\.|$)">
        Require all denied
    </FilesMatch>

    # Keep hidden files and local configuration private.
    <FilesMatch "(?i)(?:^\.|^(?:php\.ini|web\.config)$)">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; sandbox"

        # Match MediaWiki's PDF policy so browser PDF viewers can load the document.
        <FilesMatch "(?i)\.pdf$">
            Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline' data:; font-src data:; img-src data: 'self'; media-src data: 'self'; object-src 'self'"
        </FilesMatch>
    </IfModule>
</Directory>

# These upload trees must never be served directly, including their descendants.
<DirectoryMatch "^/var/www/html/images/(?:deleted|temp|lockdir)(?:/|$)">
    Require all denied
</DirectoryMatch>
