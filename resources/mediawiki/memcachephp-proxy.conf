# Short URLs -> with slash
RedirectMatch 301 ^/memcacheui$ /memcacheui/
RedirectMatch 301 ^/memcache$   /memcacheui/
RedirectMatch 301 ^/mcui$       /memcacheui/

<IfModule mod_proxy.c>
  ProxyRequests Off
  ProxyPreserveHost On
  # Adds X-Forwarded-For / X-Forwarded-Host / X-Forwarded-Server to proxied requests
  ProxyAddHeaders On

  # Reverse proxy for /memcacheui/
  ProxyPass        /memcacheui/  http://memcachephp:80/
  ProxyPassReverse /memcacheui/  http://memcachephp:80/

  # Limit cookies to subpath
  ProxyPassReverseCookiePath / /memcacheui/

  # Extra forwarded headers ONLY for the memcache UI - never for MediaWiki itself.
  # "expr=" evaluates request variables; "%{...}s" would read SSL variables and
  # yield "(null)" on plain HTTP.
  <Location /memcacheui/>
    RequestHeader set X-Forwarded-Proto  "expr=%{REQUEST_SCHEME}"
    RequestHeader set X-Real-IP          "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Prefix "/memcacheui"
  </Location>
</IfModule>
